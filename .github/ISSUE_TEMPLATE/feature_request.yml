name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前遇到了什么限制？在什么场景下需要？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 期望的行为或交互。
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: 安全边界影响
      description: 是否涉及凭据、guest 能力、网络出口、宿主文件访问或审批流程？如何保持现有保证？
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案
      description: 考虑过的替代方案或参考实现。
