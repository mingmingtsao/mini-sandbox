name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '27 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            runner: ubuntu-24.04
          - language: python
            build-mode: none
            runner: ubuntu-24.04
          - language: go
            build-mode: manual
            runner: ubuntu-24.04
          - language: swift
            build-mode: manual
            runner: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.language == 'go'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: Tests/GuestFixtureTests/go.mod
          cache: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - if: matrix.language == 'go'
        name: Build the Go guest probe and protocol tests
        # The CodeQL Go tracer follows the working directory, not `go -C`.
        run: |
          cd "$GITHUB_WORKSPACE/Tools/GuestFixture"
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build ./...
          cd "$GITHUB_WORKSPACE/Tests/GuestFixtureTests"
          go test -c -o "$RUNNER_TEMP/guest-protocol.test" .
      - if: matrix.language == 'swift'
        name: Build all Swift targets
        run: swift build
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
